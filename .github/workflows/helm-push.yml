---
# checkov:skip=CKV2_GHA_1:Permissions are set by the caller of this reusable workflow
# Caller permissions:
#   min: { contents: read, packages: write }
#   max: { contents: read, packages: write }
name: Helm Push

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout (empty = checkout action default)"
        required: false
        type: string
      dry-run:
        description: "Run in dry-run mode (package but do not push)"
        required: false
        type: boolean
        default: false
      helm-version:
        description: "Helm version to install (e.g. v3.17.3)"
        required: false
        type: string
        default: latest
      chart-path:
        description: "Path to the Helm chart directory"
        required: true
        type: string
      version:
        description: "Chart version to set (passed to helm package --version)"
        required: false
        type: string
      app-version:
        description: "App version to set (passed to helm package --app-version)"
        required: false
        type: string
      registry:
        description: "OCI registry to push to (e.g. ghcr.io)"
        required: false
        type: string
        default: "ghcr.io"
      repository:
        description: "OCI repository path without registry prefix (e.g. owner/charts). Defaults to github.repository."
        required: false
        type: string
      download-artifact-name:
        description: "Name of a build artifact to download before packing (empty to skip)"
        required: false
        type: string
      download-all-artifacts:
        description: "Download all artifacts before packing"
        required: false
        type: boolean
        default: false
      download-artifact-path:
        description: "Path to download the artifact to (relative to workspace)"
        required: false
        type: string
      download-artifact-merge-multiple:
        description: "Merge multiple artifacts into a single directory"
        required: false
        type: boolean
        default: true
      download-artifact-continue-on-error:
        description: "Continue workflow if artifact download fails"
        required: false
        type: boolean
        default: false
    secrets:
      REGISTRY_USERNAME:
        description: "Registry username (optional, defaults to github.repository_owner)"
        required: false
      REGISTRY_PASSWORD:
        description: "Registry password (optional, defaults to GITHUB_TOKEN)"
        required: false
    outputs:
      chart:
        description: "Packaged chart filename"
        value: ${{ jobs.push.outputs.chart }}
      version:
        description: "Chart version that was pushed"
        value: ${{ jobs.push.outputs.version }}

jobs:
  push: # zizmor: ignore[secrets-outside-env]
    name: Helm Push
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ steps.package.outputs.chart }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download Artifact
        if: ${{ inputs.download-artifact-name != '' || inputs.download-all-artifacts }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.download-artifact-name }}
          path: ${{ inputs.download-artifact-path }}
          merge-multiple: ${{ inputs.download-artifact-merge-multiple }}
        continue-on-error: ${{ inputs.download-artifact-continue-on-error }}

      - name: Setup Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Helm Registry Login
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          USERNAME: ${{ secrets.REGISTRY_USERNAME || github.repository_owner }}
          PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
        run: |
          echo "${PASSWORD}" | helm registry login "${REGISTRY}" \
            --username "${USERNAME}" \
            --password-stdin

      - name: Package Chart
        id: package
        shell: bash
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          VERSION: ${{ inputs.version }}
          APP_VERSION: ${{ inputs.app-version }}
        run: |
          # shellcheck disable=SC2086
          OUTPUT=$(helm package ${VERSION:+--version "${VERSION}"} ${APP_VERSION:+--app-version "${APP_VERSION}"} "${CHART_PATH}")
          CHART_FILE=$(echo "${OUTPUT}" | grep -oP '(?<=Successfully packaged chart and saved it to: ).*')
          echo "chart=${CHART_FILE}" >> "${GITHUB_OUTPUT}"
          CHART_VERSION=$(helm show chart "${CHART_FILE}" | grep '^version:' | awk '{print $2}')
          echo "version=${CHART_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Packaged: ${CHART_FILE} (version: ${CHART_VERSION})"

      - name: Push Chart
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          CHART_FILE: ${{ steps.package.outputs.chart }}
          REGISTRY: ${{ inputs.registry }}
          REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          echo "Pushing ${CHART_FILE} to oci://${REGISTRY}/${REPOSITORY}"
          helm push "${CHART_FILE}" "oci://${REGISTRY}/${REPOSITORY}"

      - name: Dry Run
        if: ${{ inputs.dry-run }}
        shell: bash
        env:
          CHART_FILE: ${{ steps.package.outputs.chart }}
          REGISTRY: ${{ inputs.registry }}
          REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          echo "[dry-run] Would push: ${CHART_FILE} -> oci://${REGISTRY}/${REPOSITORY}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ inputs.dry-run && '[DRY RUN] ' || '' }}Helm Push Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Chart | \`${CHART_FILE}\` |"
            echo "| Version | \`${CHART_VERSION}\` |"
            echo "| Registry | \`${REGISTRY}/${REPOSITORY}\` |"
            if [[ "${{ inputs.dry-run }}" == "true" ]]; then
              echo "| Status | :no_entry_sign: Dry Run |"
            else
              echo "| Status | :white_check_mark: Pushed |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          CHART_FILE: ${{ steps.package.outputs.chart }}
          CHART_VERSION: ${{ steps.package.outputs.version }}
          REGISTRY: ${{ inputs.registry }}
          REPOSITORY: ${{ inputs.repository || github.repository }}
