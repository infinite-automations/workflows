---
# Caller permissions (validated statically by GitHub, regardless of dry-run):
#   required: { contents: read, packages: write }
name: CD (Docker + Helm)

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Run in dry-run mode (do not tag or deploy)"
        required: false
        type: boolean
        default: false
      deploy-dry-run:
        description: "Run deploy in dry-run mode (tag normally but only template/diff the Helm release)"
        required: false
        type: boolean
        default: false
      image:
        description: "Full image name (e.g. ghcr.io/owner/repo)"
        required: false
        type: string
        default: "ghcr.io/${{ github.repository }}"
      tags:
        description: "Newline-separated tags to apply to the image (only if provided)"
        required: false
        type: string
      tag-semver:
        description: "Semver tag pattern for source resolution (must match docker workflow config)"
        required: false
        type: string
        default: "{{version}}"
      registry:
        description: "Container registry to authenticate with"
        required: false
        type: string
        default: "ghcr.io"
      # renovate: datasource=github-releases depName=oras-project/oras
      oras-version:
        description: "ORAS CLI version to install"
        required: false
        type: string
        default: "1.2.2"
      release-name:
        description: "Helm release name"
        required: true
        type: string
      chart:
        description: "Helm chart reference"
        required: true
        type: string
      chart-version:
        description: "Helm chart version"
        required: false
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: false
        type: string
        default: "default"
      values-files:
        description: "Newline-separated list of Helm values files"
        required: false
        type: string
      set-values:
        description: "Newline-separated list of --set key=value pairs"
        required: false
        type: string
      helm-repos:
        description: "Newline-separated list of Helm repos (name=url)"
        required: false
        type: string
      image-tag:
        description: "Image tag to deploy (passed as deployment.image.tag)"
        required: false
        type: string
      create-namespace:
        description: "Create namespace if it does not exist"
        required: false
        type: boolean
        default: true
      deploy-environment:
        description: "GitHub environment name for deployment protection"
        required: false
        type: string
      deploy-runner:
        description: "Runner label for the deploy job"
        required: false
        type: string
        default: "ubuntu-latest"
      helm-registry:
        description: "OCI registry for private Helm charts (e.g. ghcr.io)"
        required: false
        type: string
    secrets:
      REGISTRY_USERNAME:
        description: "Registry username (optional, defaults to github.repository_owner)"
        required: false
      REGISTRY_PASSWORD:
        description: "Registry password (optional, defaults to GITHUB_TOKEN)"
        required: false
      HELM_REGISTRY_USERNAME:
        description: "Username for private Helm chart registry (optional)"
        required: false
      HELM_REGISTRY_PASSWORD:
        description: "Password/token for private Helm chart registry (optional)"
        required: false
      KUBECONFIG:
        description: "Kubeconfig content for Kubernetes cluster authentication (optional)"
        required: false
    outputs:
      retag-tags:
        description: "Tags applied to the image"
        value: ${{ jobs.retag.outputs.tags }}
      deploy-status:
        description: "Deploy result status"
        value: ${{ jobs.deploy.outputs.status }}

permissions: {}

jobs:
  retag:
    name: Retag Image
    if: ${{ inputs.tags != '' }}
    uses: ./.github/workflows/oras-tag.yml
    with:
      dry-run: ${{ inputs.dry-run }}
      image: ${{ inputs.image }}
      tag-semver: ${{ inputs.tag-semver }}
      tags: ${{ inputs.tags }}
      registry: ${{ inputs.registry }}
      oras-version: ${{ inputs.oras-version }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy
    needs: [retag]
    if: ${{ !cancelled() && (needs.retag.result == 'success' || needs.retag.result == 'skipped') }}
    uses: ./.github/workflows/deploy-helm.yml
    with:
      dry-run: ${{ inputs.dry-run || inputs.deploy-dry-run }}
      release-name: ${{ inputs.release-name }}
      chart: ${{ inputs.chart }}
      chart-version: ${{ inputs.chart-version }}
      namespace: ${{ inputs.namespace }}
      values-files: ${{ inputs.values-files }}
      set-values: ${{ inputs.set-values }}
      helm-repos: ${{ inputs.helm-repos }}
      image-tag: ${{ inputs.image-tag }}
      create-namespace: ${{ inputs.create-namespace }}
      environment: ${{ inputs.deploy-environment }}
      runner: ${{ inputs.deploy-runner }}
      registry: ${{ inputs.helm-registry }}
    secrets:
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
      REGISTRY_USERNAME: ${{ secrets.HELM_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.HELM_REGISTRY_PASSWORD }}
    permissions:
      contents: read
