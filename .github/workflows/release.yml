---
# checkov:skip=CKV2_GHA_1:Permissions are set by the caller of this reusable workflow
# Caller permissions:
#   min (dry-run):  { contents: read }
#   max (release):  { contents: write, issues: write, pull-requests: write }
name: Release

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Run semantic-release in dry-run mode"
        required: false
        type: boolean
        default: false
      extra-plugins:
        description: "Newline-separated list of extra semantic-release plugins"
        required: false
        type: string
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "lts/*"
    secrets:
      APP_ID:
        description: "GitHub App ID for authentication (optional, falls back to GITHUB_TOKEN)"
        required: false
      APP_PRIVATE_KEY:
        description: "GitHub App private key for authentication (optional)"
        required: false
    outputs:
      version:
        description: "Released version (empty if no release)"
        value: ${{ jobs.release.outputs.version }}
      published:
        description: "Whether a new version was published"
        value: ${{ jobs.release.outputs.published }}
      major:
        description: "Major version number"
        value: ${{ jobs.release.outputs.major }}
      minor:
        description: "Minor version number"
        value: ${{ jobs.release.outputs.minor }}
      patch:
        description: "Patch version number"
        value: ${{ jobs.release.outputs.patch }}

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic-release.outputs.new_release_version }}
      published: ${{ steps.semantic-release.outputs.new_release_published }}
      major: ${{ steps.semantic-release.outputs.new_release_major_version }}
      minor: ${{ steps.semantic-release.outputs.new_release_minor_version }}
      patch: ${{ steps.semantic-release.outputs.new_release_patch_version }}
    env:
      HAS_APP_CREDENTIALS: ${{ secrets.APP_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Docs Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
        continue-on-error: true

      - name: Get GitHub App Token
        id: app-token
        if: env.HAS_APP_CREDENTIALS == 'true'
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Semantic Release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6
        with:
          extra_plugins: ${{ inputs.extra-plugins }}
          dry_run: ${{ inputs.dry-run }}
          ci: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Dry Run | ${{ inputs.dry-run }} |"
            if [[ "${STEPS_SEMANTIC_RELEASE_OUTPUTS_NEW_RELEASE_PUBLISHED}" == "true" ]]; then
              echo "| Published | :white_check_mark: Yes |"
              echo "| Version | \`${STEPS_SEMANTIC_RELEASE_OUTPUTS_NEW_RELEASE_VERSION}\` |"
            else
              echo "| Published | :no_entry_sign: No |"
            fi
            if [[ -n "${STEPS_APP_TOKEN_OUTPUTS_TOKEN}" ]]; then
              echo "| Auth | GitHub App |"
            else
              echo "| Auth | GITHUB_TOKEN |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          STEPS_SEMANTIC_RELEASE_OUTPUTS_NEW_RELEASE_PUBLISHED: ${{ steps.semantic-release.outputs.new_release_published }}
          STEPS_SEMANTIC_RELEASE_OUTPUTS_NEW_RELEASE_VERSION: ${{ steps.semantic-release.outputs.new_release_version }}
          STEPS_APP_TOKEN_OUTPUTS_TOKEN: ${{ steps.app-token.outputs.token }}
