---
# checkov:skip=CKV2_GHA_1:Permissions are set by the caller of this reusable workflow
# Caller permissions:
#   min (dry-run):  { contents: read }
#   max (release):  { contents: write, issues: write, pull-requests: write }
name: Release

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout (empty = checkout action default)"
        required: false
        type: string
      dry-run:
        description: "Run semantic-release in dry-run mode"
        required: false
        type: boolean
        default: false
      extra-plugins:
        description: "Newline-separated list of extra semantic-release plugins"
        required: false
        type: string
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "lts/*"
      download-artifact-name:
        description: "Name of a build artifact to download before releasing (empty to skip)"
        required: false
        type: string
      download-all-artifacts:
        description: "Download all artifacts before releasing (ignored if download-artifact-name is set)"
        required: false
        type: boolean
        default: false
      download-artifact-path:
        description: "Path to download the artifact to (relative to workspace)"
        required: false
        type: string
      download-artifact-merge-multiple:
        description: "Merge multiple artifacts into a single directory"
        required: false
        type: boolean
        default: true
      download-artifact-continue-on-error:
        description: "Continue workflow if artifact download fails"
        required: false
        type: boolean
        default: false
      semantic-version:
        description: "Version range for semantic-release (e.g. '19.0.5')"
        required: false
        type: string
      branches:
        description: "Branches on which releases should happen (semantic-release v16+, JSON array or string)"
        required: false
        type: string
      branch:
        description: "Branch on which releases should happen (semantic-release older than v16)"
        required: false
        type: string
      working-directory:
        description: "Working directory for semantic release (useful for monorepos)"
        required: false
        type: string
      tag-format:
        description: "Tag format override, useful for monorepos (e.g. 'my-package-v${version}')"
        required: false
        type: string
      extends:
        description: "Newline-separated list of sharable configurations to extend"
        required: false
        type: string
      ci:
        description: "Whether to run semantic release with CI support (semantic-release v16+)"
        required: false
        type: boolean
        default: true
      unset-gha-env:
        description: "Unset the GITHUB_ACTIONS env variable (useful for PR dry-run validation)"
        required: false
        type: boolean
        default: false
      repository-url:
        description: "Git repository URL (defaults to current repository)"
        required: false
        type: string
    secrets:
      APP_ID:
        description: "GitHub App ID for authentication (optional, falls back to GITHUB_TOKEN)"
        required: false
      APP_PRIVATE_KEY:
        description: "GitHub App private key for authentication (optional)"
        required: false
    outputs:
      version:
        description: "Released version (empty if no release)"
        value: ${{ jobs.release.outputs.version }}
      published:
        description: "Whether a new version was published"
        value: ${{ jobs.release.outputs.published }}
      major:
        description: "Major version number"
        value: ${{ jobs.release.outputs.major }}
      minor:
        description: "Minor version number"
        value: ${{ jobs.release.outputs.minor }}
      patch:
        description: "Patch version number"
        value: ${{ jobs.release.outputs.patch }}

jobs:
  release: # zizmor: ignore[secrets-outside-env]
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic-release.outputs.new_release_version }}
      published: ${{ steps.semantic-release.outputs.new_release_published }}
      major: ${{ steps.semantic-release.outputs.new_release_major_version }}
      minor: ${{ steps.semantic-release.outputs.new_release_minor_version }}
      patch: ${{ steps.semantic-release.outputs.new_release_patch_version }}
    env:
      HAS_APP_CREDENTIALS: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Artifact
        if: ${{ inputs.download-artifact-name != '' || inputs.download-all-artifacts }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.download-artifact-name }}
          path: ${{ inputs.download-artifact-path }}
          merge-multiple: ${{ inputs.download-artifact-merge-multiple }}
        continue-on-error: ${{ inputs.download-artifact-continue-on-error }}

      - name: Get GitHub App Token
        id: app-token
        if: env.HAS_APP_CREDENTIALS == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure Git Authentication
        if: steps.app-token.outputs.token != ''
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Semantic Release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: ${{ inputs.semantic-version }}
          branches: ${{ inputs.branches }}
          branch: ${{ inputs.branch }}
          extra_plugins: ${{ inputs.extra-plugins }}
          extends: ${{ inputs.extends }}
          dry_run: ${{ inputs.dry-run }}
          ci: ${{ inputs.ci }}
          unset_gha_env: ${{ inputs.unset-gha-env }}
          working_directory: ${{ inputs.working-directory }}
          tag_format: ${{ inputs.tag-format }}
          repository_url: ${{ inputs.repository-url }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ inputs.dry-run && '[DRY RUN] ' || '' }}Release Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            if [[ "${STEPS_SEMANTIC_RELEASE_OUTPUTS_NEW_RELEASE_PUBLISHED}" == "true" ]]; then
              echo "| Published | :white_check_mark: Yes |"
              echo "| Version | \`${STEPS_SEMANTIC_RELEASE_OUTPUTS_NEW_RELEASE_VERSION}\` |"
            else
              echo "| Published | :no_entry_sign: No |"
            fi
            if [[ -n "${STEPS_APP_TOKEN_OUTPUTS_TOKEN}" ]]; then
              echo "| Auth | GitHub App |"
            else
              echo "| Auth | GITHUB_TOKEN |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          STEPS_SEMANTIC_RELEASE_OUTPUTS_NEW_RELEASE_PUBLISHED: ${{ steps.semantic-release.outputs.new_release_published }}
          STEPS_SEMANTIC_RELEASE_OUTPUTS_NEW_RELEASE_VERSION: ${{ steps.semantic-release.outputs.new_release_version }}
          STEPS_APP_TOKEN_OUTPUTS_TOKEN: ${{ steps.app-token.outputs.token }}
